# Render blueprint for the FastAPI multi-agent service.
# Note: the free instance has 512 MB RAM; PyTorch plus the Granite embedder can
# exceed that. Hugging Face Spaces (Docker) is the recommended host for the
# backend — see README "Deploy". The index ships in the image, so no disk is
# required; SQLite lives on the ephemeral filesystem and resets on redeploy.
services:
  - type: web
    name: minerakshak-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: EMBED_MODEL
        value: ibm-granite/granite-embedding-small-english-r2
      - key: RERANK_MODEL
        value: Alibaba-NLP/gte-reranker-modernbert-base
      - key: AGENT_LLM_MODE
        value: auto
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SEED_DEMO
        value: "1"
      - key: ENABLE_WARMUP
        value: "1"
      - key: DB_PATH
        value: /tmp/minerakshak.db
