# Render blueprint for the FastAPI multi-agent service.
# Note: the free instance has 512 MB RAM; sentence-transformers + PyTorch can
# exceed that. Hugging Face Spaces (Docker) is the recommended free host for
# the backend — see README "Deploy the backend".
services:
  - type: web
    name: minerakshak-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: EMBED_MODEL
        value: Qwen/Qwen3-Embedding-0.6B
      - key: RERANK_MODEL
        value: Qwen/Qwen3-Reranker-0.6B
      - key: AGENT_LLM_MODE
        value: auto
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SEED_DEMO
        value: "1"
      - key: ENABLE_WARMUP
        value: "1"
      - key: DB_PATH
        value: /var/data/minerakshak.db
    disk:
      name: minerakshak-data
      mountPath: /var/data
      sizeGB: 1
