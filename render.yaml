# Render blueprint for the FastAPI multi-agent service.
# Note: the free instance has 512 MB RAM; PyTorch plus the Granite embedder can
# exceed that. Hugging Face Spaces (Docker) is the recommended host for the
# backend — see README "Deploy". The index ships in the image, so no disk is
# required; SQLite lives on the ephemeral filesystem and resets on redeploy.
services:
  - type: web
    name: minerakshak-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: EMBED_MODEL
        value: ibm-granite/granite-embedding-small-english-r2
      - key: RERANK_MODEL
        value: Alibaba-NLP/gte-reranker-modernbert-base
      - key: AGENT_LLM_MODE
        value: auto
      # The browser talks to the Vercel proxy, not to this origin directly, so CORS
      # is not load-bearing for the review demo; * keeps the blueprint prompt-free.
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SEED_DEMO
        value: "1"
      - key: ENABLE_WARMUP
        value: "1"
      # 512 MB free instance: ONNX embedder (no PyTorch at runtime), one thread,
      # glibc arenas capped. Measured RSS ~0.35-0.4 GB (see README).
      - key: EMBED_BACKEND
        value: onnx
      - key: TORCH_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: DB_PATH
        value: /tmp/minerakshak.db
